# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
# 4GB heap allocation with G1GC prevents memory thrashing & OutOfMemory errors during Dex merging.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC

# Enable Gradle caching and parallel build execution for maximum build speed
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX package structure
android.useAndroidX=true

# Enable AAPT2 PNG crunching in release builds
android.enablePngCrunchInReleaseBuilds=true

# Target architectures for local development (CI overrides to arm64-v8a for speed)
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Architecture switches
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Image extensions
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

EX_DEV_CLIENT_NETWORK_INSPECTOR=true
expo.useLegacyPackaging=false
expo.inlineModules.watchedDirectories=[]