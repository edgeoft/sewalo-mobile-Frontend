# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

This file is auto-generated from conventional commits. Do not edit it manually.
"""
# A Tera template to be rendered for each release in the changelog.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}]
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}**BREAKING**: {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
# Parse commits according to the conventional commits specification.
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = true
# Require all commits to be conventional.
require_conventional = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# Assigns commits to groups.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactored" },
  { message = "^test", group = "<!-- 4 -->Testing" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^chore: update changelog", skip = true },
  { message = "^chore|^ci|^build|^style", group = "<!-- 6 -->Miscellaneous" },
  { message = "^revert", group = "<!-- 7 -->Reverted" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Order commits in each group/release within the changelog.
sort_commits = "oldest"
