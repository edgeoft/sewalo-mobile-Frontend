name: Build & Distribute

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_group:
        description: 'Firebase App Distribution release group'
        required: false
        default: ''

concurrency:
  group: build-distribute-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_OPTIONS: '--no-deprecation --no-warnings'

jobs:
  build-and-distribute:
    name: Build APK & Distribute
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # --- Secrets ---
      - name: Decode secrets
        run: |
          [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ] && echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          [ -n "${{ secrets.ENV_FILE_BASE64 }}" ] && echo "${{ secrets.ENV_FILE_BASE64 }}" | base64 -d > .env

      # --- Version (single source of truth) ---
      - name: Calculate version
        id: version
        run: node scripts/bump-version.js --write --ci

      - name: Build Android APK
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC'
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -PversionCode=${{ steps.version.outputs.BUILD_NUMBER }} \
            -PversionName="${{ steps.version.outputs.VERSION }}"

      # --- Release notes ---
      - name: Generate release notes
        run: |
          echo "## Sewalo ${{ steps.version.outputs.VERSION }} (Build #${{ steps.version.outputs.BUILD_NUMBER }})" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          pnpm git-cliff --unreleased --strip header >> RELEASE_NOTES.md 2>/dev/null || true
          # Fallback if git-cliff produces nothing
          if [ $(wc -l < RELEASE_NOTES.md) -le 3 ]; then
            echo "### Changes:" >> RELEASE_NOTES.md
            git log -n 15 --pretty=format:"- %s" | grep -E "^- (feat|fix|perf)(\(.*\))?:" >> RELEASE_NOTES.md || true
          fi

      # --- Tag & sync version ---
      - name: Tag and sync version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit updated package.json
          if [ -n "$(git status --porcelain package.json)" ]; then
            git add package.json
            git commit -m "chore(release): v${VERSION} [skip ci]"
            git push origin main
          fi

          # Tag (skip if tag already exists)
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      # --- Distribute ---
      - name: Upload to Firebase App Distribution
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY != '' }}
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" > gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=gcp-key.json
          GROUPS="${{ secrets.FIREBASE_GROUPS || inputs.release_group || 'internal-testers' }}"
          EXTRA="--groups $GROUPS"
          [ -n "${{ secrets.FIREBASE_TESTERS }}" ] && EXTRA="$EXTRA --testers ${{ secrets.FIREBASE_TESTERS }}"
          pnpm firebase appdistribution:distribute \
            android/app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" $EXTRA \
            --release-notes-file RELEASE_NOTES.md

      - name: Cleanup
        if: always()
        run: rm -f .env gcp-key.json android/app/release.jks android/app/google-services.json RELEASE_NOTES.md
