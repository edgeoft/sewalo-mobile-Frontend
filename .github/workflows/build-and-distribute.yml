name: Android Build & Firebase App Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_group:
        description: 'Firebase App Distribution Release Group'
        required: true
        default: 'internal-testers'

concurrency:
  group: build-distribute-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-distribute:
    name: Build APK/AAB & Distribute via Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Enable Corepack & pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Configure Android Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build Android Release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Prepare Release Notes
        run: |
          echo "Automated Sewalo build commit: ${GITHUB_SHA:0:7}" > RELEASE_NOTES.md

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_KEY != '' }}
        uses: wshipbg/firebase-app-distribution-action@v1
        with:
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          appId: ${{ secrets.FIREBASE_APP_ID }}
          file: android/app/build/outputs/apk/release/app-release.apk
          groups: ${{ inputs.release_group || 'internal-testers' }}
          releaseNotesFile: RELEASE_NOTES.md
