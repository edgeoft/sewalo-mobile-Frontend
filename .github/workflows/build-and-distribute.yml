name: Android Build & Firebase App Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_group:
        description: 'Firebase App Distribution Release Group'
        required: false
        default: ''

concurrency:
  group: build-distribute-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_OPTIONS: '--no-deprecation --no-warnings'

jobs:
  build-and-distribute:
    name: Build APK & Distribute via Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 15

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Configure Android Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks

      - name: Configure .env Environment Variables
        env:
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
          EXPO_PUBLIC_ENV: ${{ secrets.EXPO_PUBLIC_ENV || 'dev' }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_S3_BASE_URL: ${{ secrets.EXPO_PUBLIC_S3_BASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.EXPO_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
        run: |
          if [ -n "$ENV_FILE_BASE64" ]; then
            echo "$ENV_FILE_BASE64" | base64 -d > .env
          else
            echo "EXPO_PUBLIC_ENV=$EXPO_PUBLIC_ENV" > .env
            [ -n "$EXPO_PUBLIC_API_BASE_URL" ] && echo "EXPO_PUBLIC_API_BASE_URL=$EXPO_PUBLIC_API_BASE_URL" >> .env
            [ -n "$EXPO_PUBLIC_S3_BASE_URL" ] && echo "EXPO_PUBLIC_S3_BASE_URL=$EXPO_PUBLIC_S3_BASE_URL" >> .env
            [ -n "$GOOGLE_MAPS_API_KEY" ] && echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" >> .env
            [ -n "$EXPO_PUBLIC_POSTHOG_PROJECT_TOKEN" ] && echo "EXPO_PUBLIC_POSTHOG_PROJECT_TOKEN=$EXPO_PUBLIC_POSTHOG_PROJECT_TOKEN" >> .env
            [ -n "$POSTHOG_API_KEY" ] && echo "POSTHOG_API_KEY=$POSTHOG_API_KEY" >> .env
            [ -n "$EXPO_PUBLIC_POSTHOG_HOST" ] && echo "EXPO_PUBLIC_POSTHOG_HOST=$EXPO_PUBLIC_POSTHOG_HOST" >> .env
          fi

      - name: Fast Compile Android Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Generate Automated Release Notes
        run: |
          echo "## Sewalo Build (${GITHUB_SHA:0:7})" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Recent Commit Changes:" >> RELEASE_NOTES.md
          git log -n 10 --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_KEY != '' }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=gcp-key.json
          TARGET_GROUPS="${FIREBASE_GROUPS:-${{ inputs.release_group || 'internal-testers' }}}"
          EXTRA_FLAGS="--groups $TARGET_GROUPS"
          if [ -n "$FIREBASE_TESTERS" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --testers $FIREBASE_TESTERS"
          fi
          pnpm firebase appdistribution:distribute android/app/build/outputs/apk/release/app-release.apk --app "$FIREBASE_APP_ID" $EXTRA_FLAGS --release-notes-file RELEASE_NOTES.md

      - name: Security Cleanup of Credentials
        if: always()
        run: |
          rm -f .env gcp-key.json android/app/release.jks android/app/google-services.json RELEASE_NOTES.md
